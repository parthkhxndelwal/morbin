name: Deploy staging to Cloudflare Workers

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_APP_URL: https://morbin-dev.parthkhandelwal-dev.workers.dev
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_TdZnvBU8mAc2NT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy staging to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy --config wrangler.dev.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
